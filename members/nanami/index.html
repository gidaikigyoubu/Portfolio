<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自己紹介</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fffafc;--card:#ffffff;--text:#a8909b;--sub:#cdbcc4;--accent:#f4b8cb;--chip:#fff3f7;--line:#fee8ef;color-scheme:light}
:root{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.8}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.hero{text-align:center;padding:32px 16px}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 16px}
h1{margin:0;font-size:1.7rem}
.badge{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;background:#fff0f5;color:#eaa5bc;font-size:.9rem}
.card{background:var(--card);border:2px dashed var(--line);border-radius:24px;padding:20px;margin-top:16px}
h2{margin:0 0 8px;font-size:1.1rem;color:var(--accent)}
p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chips li{background:var(--chip);padding:4px 12px;border-radius:999px;font-size:.9rem}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
dt{color:var(--sub)}dd{margin:0}
footer{text-align:center;color:var(--sub);font-size:.8rem;margin-top:32px}
</style>
</head>
<body>
<div style="width:100%;max-width:1080px;margin:0 auto;padding:12px 16px;box-sizing:border-box;text-align:left;position:relative;z-index:40"><a href="../../" style="display:inline-block;padding:6px 14px;border-radius:999px;background:#ffffff;color:#333333;font:700 13px/1.6 'Hiragino Sans','Noto Sans JP',sans-serif;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.18)">← メンバー図鑑に戻る</a></div>
<main>
  <section class="hero">
    <div class="avatar">🌸</div>
    <h1>ななみ</h1>
    <span class="badge">社会システム経営学環 1年</span>
  </section>

  <section class="card">
    <h2>🎀 はじめまして</h2>
    <p>社会システム経営学環1年のななみです。好きなものは赤福で、最近は麻辣湯にハマっています。よろしくお願いします!</p>
  </section>

  <section class="card">
    <h2>🧸 プロフィール</h2>
    <dl>
      <dt>所属</dt><dd>社会システム経営学環</dd>
      <dt>学年</dt><dd>1年</dd>
      <dt>好きなもの</dt><dd>赤福 🍡</dd>
      <dt>最近ハマり中</dt><dd>麻辣湯 🌶️</dd>
    </dl>
  </section>

  <section class="card">
    <h2>✨ 興味のあること</h2>
    <ul class="chips"><li>経営</li><li>社会システム</li></ul>
  </section>

  <section class="card">
    <h2>🍡 好きなもの</h2>
    <ul class="chips"><li>赤福</li><li>麻辣湯</li></ul>
  </section>

  <footer>© 2026 ななみ</footer>
</main>
</body>
</html>
