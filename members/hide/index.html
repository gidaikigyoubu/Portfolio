<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヒデの自己紹介</title>
<style>
  :root {
    --bg: #f3f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --sub: #6b7280;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --sub: #94a3b8;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header {
    text-align: center;
    padding: 36px 16px 32px;
    border-radius: 20px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    margin-bottom: 20px;
  }
  .avatar {
    width: 88px; height: 88px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem; font-weight: 700;
  }
  h1 { font-size: 1.6rem; }
  header p { opacity: .9; font-size: .95rem; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .label {
    font-size: .8rem;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: .05em;
    margin-bottom: 2px;
  }
  .value { font-size: 1.1rem; font-weight: 600; }
  footer { text-align: center; color: var(--sub); font-size: .8rem; margin-top: 24px; }
</style>
</head>
<body>
<div style="width:100%;max-width:1080px;margin:0 auto;padding:12px 16px;box-sizing:border-box;text-align:left;position:relative;z-index:40"><a href="../../" style="display:inline-block;padding:6px 14px;border-radius:999px;background:#ffffff;color:#333333;font:700 13px/1.6 'Hiragino Sans','Noto Sans JP',sans-serif;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.18)">← メンバー図鑑に戻る</a></div>
<div class="wrap">
  <header>
    <div class="avatar">ヒデ</div>
    <h1>ヒデ</h1>
    <p>自己紹介ページへようこそ！</p>
  </header>

  <section class="card">
    <div class="label">ニックネーム</div>
    <div class="value">ヒデ</div>
  </section>

  <section class="card">
    <div class="label">学部・学年</div>
    <div class="value">工学部 1年</div>
  </section>

  <section class="card">
    <div class="label">好きなもの</div>
    <div class="value">単発バイト</div>
  </section>

  <section class="card">
    <div class="label">最近はまっていること</div>
    <div class="value">プログラミング</div>
  </section>

  <section class="card">
    <div class="label">一言</div>
    <div class="value">最近起業部に行ってなくて肩身が狭いです</div>
    <div class="value">バイトに最近落ちました</div>
  </section>

  <footer>© ヒデ</footer>
</div>
</body>
</html>
