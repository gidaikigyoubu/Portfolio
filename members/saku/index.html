<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>さく の自己紹介</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --moss-dark: #1f2418;
    --moss: #3b4528;
    --bark: #3a2b1f;
    --bark-line: #5c4630;
    --cap-light: #d79a5a;
    --cap-mid: #a9622f;
    --cap-dark: #6e3a1b;
    --stem: #f1e3c8;
    --stem-shade: #d9c49b;
    --text: #f1e6d0;
    --text-sub: #b9a98a;
    --ink: #4a2c15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at 50% 0%, #4c5a33 0%, rgba(76,90,51,0) 55%),
      linear-gradient(#2a3020 0%, var(--moss-dark) 60%, #17140f 100%);
    color: var(--text);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    padding: calc(40px + env(safe-area-inset-top, 0px)) 20px calc(48px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 420px; text-align: center; }

  /* なめこ（ここだけポップ） */
  .nameko { width: 250px; margin: 0 auto; animation: bounce 2.8s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    50% { transform: translateY(-8px) scale(.98, 1.03); }
  }
  @media (prefers-reduced-motion: reduce) { .nameko { animation: none; } }
  .cap {
    position: relative;
    height: 125px;
    background:
      radial-gradient(ellipse at 32% 28%, #ffc45a 0%, #ff8a3d 50%, #f0552e 100%);
    border-radius: 50% 50% 44% 44% / 100% 100% 38% 38%;
    box-shadow: inset 0 -10px 16px rgba(160, 40, 10, .35), 0 6px 14px rgba(0,0,0,.35);
  }
  .cap::before {
    content: "";
    position: absolute;
    left: 14%; top: 14%;
    width: 30%; height: 16%;
    background: rgba(255, 255, 255, .6);
    border-radius: 50%;
    transform: rotate(-22deg);
  }
  .stem {
    position: relative;
    width: 118px;
    margin: -14px auto 0;
    padding: 30px 0 22px;
    background: linear-gradient(90deg, #fbd9d0, #fff4ec 35%, #fff4ec 65%, #fbd9d0);
    border-radius: 6px 6px 44px 44px;
    color: #c2410c;
    box-shadow: 0 8px 14px rgba(0,0,0,.3);
  }
  .stem .label { margin: 0; font-size: .7rem; color: #b8664a; }
  h1 {
    margin: 2px 0 0;
    font-size: 2.6rem;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: .04em;
  }
  .hello {
    margin: 30px 0 0;
    font-size: 1.05rem;
    line-height: 1.9;
    color: var(--text);
  }

  /* 木の板 */
  .profile {
    margin: 28px 0 0;
    padding: 6px 22px;
    text-align: left;
    background: var(--bark);
    border-radius: 18px;
    border: 1px solid var(--bark-line);
  }
  .profile div { padding: 14px 0; border-bottom: 1px solid var(--bark-line); }
  .profile div:last-child { border-bottom: 0; }
  .profile dt { font-size: .82rem; color: var(--text-sub); }
  .profile dd { margin: 4px 0 0; font-size: 1.2rem; font-weight: 700; }

  /* ひとこと */
  .word-box {
    margin-top: 28px;
    padding: 22px 20px;
    background: var(--stem);
    color: var(--ink);
    border-radius: 60px 60px 60px 18px;
    box-shadow: 0 6px 14px rgba(0,0,0,.3);
  }
  .word-box .note { margin: 0 0 6px; font-size: .85rem; font-weight: 700; color: #8a5a2c; }
  .word-box .word { margin: 0; font-size: 1.02rem; line-height: 1.9; font-weight: 700; }
</style>
</head>
<body>
  <main>
<div style="width:100%;max-width:1080px;margin:0 auto;padding:12px 16px;box-sizing:border-box;text-align:left;position:relative;z-index:40"><a href="../../" style="display:inline-block;padding:6px 14px;border-radius:999px;background:#ffffff;color:#333333;font:700 13px/1.6 'Hiragino Sans','Noto Sans JP',sans-serif;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.18)">← メンバー図鑑に戻る</a></div>
    <div class="nameko" role="img" aria-label="なめこのイラスト">
      <div class="cap"></div>
      <div class="stem">
        <p class="label">ニックネーム</p>
        <h1>さく</h1>
      </div>
    </div>

    <p class="hello">はじめまして、さくです。<br>よろしくお願いします。</p>

    <dl class="profile">
      <div>
        <dt>学部・学年</dt>
        <dd>大学1年</dd>
      </div>
      <div>
        <dt>好きなもの</dt>
        <dd>マサル</dd>
      </div>
      <div>
        <dt>最近はまっていること</dt>
        <dd>なめこの栽培キット</dd>
      </div>
    </dl>

    <div class="word-box">
      <p class="note">ひとこと</p>
      <p class="word">なめこのように、じっくり、すくすく育っていきたい。<br>毎日のぞいて、ぬるっと成長中です。</p>
    </div>
  </main>
</body>
</html>
